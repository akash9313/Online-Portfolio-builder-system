<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup | PortfolioX</title>
  <link rel="canonical" href="https://portfoliox-2e787.web.app/usersignup.html" />
  <link rel="stylesheet" href="usersignup.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="shortcut icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="login-box">
  <h2>Create <span>Account</span></h2>

  <form id="signupForm">

    <div class="field">
      <input type="email" id="email" required>
      <label>Email</label>
    </div>

    <!-- 🔐 Password -->
    <div class="field" style="position:relative;">
      <input type="password" id="password" required>
      <label>Password</label>
      <span id="togglePassword" style="
        position:absolute;
        right:14px;
        top:50%;
        transform:translateY(-50%);
        cursor:pointer;
      ">👁️</span>
    </div>

    <!-- 🔐 Confirm Password -->
    <div class="field" style="position:relative;">
      <input type="password" id="confirmPassword" required>
      <label>Confirm Password</label>
      <span id="toggleConfirmPassword" style="
        position:absolute;
        right:14px;
        top:50%;
        transform:translateY(-50%);
        cursor:pointer;
      ">👁️</span>
    </div>

    <p style="font-size:13px;color:#94a3b8;margin-bottom:12px;">
      Password must be at least 8 characters and include uppercase,
      lowercase, number, and special character.
    </p>

    <button class="primary glow" type="submit">Signup</button>

    <div style="margin:15px 0;text-align:center;">OR</div>

    <button type="button" id="googleSignup" class="primary glow">
      Continue with Google
    </button>

    <p class="signup-text">
      Already have an account?
      <a href="loginpage.html">Login</a>
    </p>
  </form>
</div>
<div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; position: relative; z-index: 10;">
  <a href="privacy.html" style="color: inherit; text-decoration: none; margin: 0 10px;">Privacy Policy</a>
  <a href="terms.html" style="color: inherit; text-decoration: none; margin: 0 10px;">Terms of Service</a>
  <a href="mailto:abuse@portfoliox.com" style="color: inherit; text-decoration: none; margin: 0 10px;">Report Abuse</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    sendEmailVerification,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");

  // 👁️ Toggle passwords
  document.getElementById("togglePassword").onclick = () => {
    password.type = password.type === "password" ? "text" : "password";
  };
  document.getElementById("toggleConfirmPassword").onclick = () => {
    confirmPassword.type =
      confirmPassword.type === "password" ? "text" : "password";
  };

  function isStrongPassword(pw) {
    return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$/.test(pw);
  }

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!isStrongPassword(password.value))
      return alert("Password not strong enough");

    if (password.value !== confirmPassword.value)
      return alert("Passwords do not match");

    const cred = await createUserWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    await sendEmailVerification(cred.user);
    alert("📧 Verification email sent (check Spam).");
    window.location.href = "loginpage.html";
  });

  document.getElementById("googleSignup").onclick = async () => {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    window.location.href = "dashboard.html";
  };
</script>

</body>
</html>
