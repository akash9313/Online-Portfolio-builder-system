<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Morph Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --white: #ffffff;
  --white-trans: rgba(255, 255, 255, 0.25);
  --white-trans-light: rgba(255, 255, 255, 0.08);
  --text: #333333;
  --text-light: #666666;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px;
  background: var(--white-trans);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-bottom: 1px solid rgba(255,255,255,.2);
  border-radius: 0 0 20px 20px;
}

.nav-logo {
  font-size: 1.5rem; font-weight: 700; color: var(--white);
  letter-spacing: 1px;
}

.nav-links { display: flex; gap: 35px; }
.nav-links a {
  color: var(--white);
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  transition: all 0.3s;
}
.nav-links a:hover { opacity: 0.8; }

@media(max-width:768px) { .nav-links { display: none; } .topnav { padding: 15px 20px; } }

.hero {
  min-height: 100vh;
  padding: 140px 40px 80px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 60px;
  align-items: center;
}
@media(max-width:900px) { .hero { grid-template-columns: 1fr; padding: 120px 24px 60px; } }

.hero-content {
  color: var(--white);
}

.hero-tag {
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  margin-bottom: 20px;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.9;
}

.hero-name {
  font-size: 4rem;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 20px;
  line-height: 1.1;
  font-family: 'Playfair Display', serif;
}

.hero-desc {
  font-size: 1.05rem;
  line-height: 1.7;
  margin-bottom: 30px;
  max-width: 500px;
  opacity: 0.95;
}

.hero-actions {
  display: flex; gap: 16px; flex-wrap: wrap;
}

.btn {
  padding: 13px 28px;
  border-radius: 12px;
  font-family: 'Poppins', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s;
  border: none;
}

.btn-glass {
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--white);
}

.btn-glass:hover {
  background: rgba(255,255,255,0.35);
  border-color: rgba(255,255,255,0.3);
}

.btn-solid {
  background: var(--white);
  color: #667eea;
}

.btn-solid:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.hero-card {
  background: var(--white-trans);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius:20px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  padding: 30px;
}

.card-title {
  font-size: 0.85rem;
  color: var(--white);
  opacity: 0.7;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.card-item {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
  font-size: 0.9rem;
}

.card-label {
  color: var(--white);
  opacity: 0.7;
  min-width: 70px;
  font-weight: 600;
}

.card-value {
  color: var(--white);
}

.section {
  padding: 100px 40px;
}

@media(max-width:768px) { .section { padding: 70px 24px; } }

.sec-label {
  font-size: 0.85rem;
  letter-spacing: 2px;
  color: var(--white);
  margin-bottom: 15px;
  text-transform: uppercase;
  opacity: 0.8;
}

.sec-title {
  font-size: 3.5rem;
  letter-spacing: 1px;
  color: var(--white);
  margin-bottom: 50px;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
}

.about-text {
  font-size: 1rem;
  line-height: 1.8;
  color: var(--white);
  background: var(--white-trans-light);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-left: 4px solid var(--white);
  padding: 30px;
  border-radius: 16px;
  max-width: 700px;
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}

.skill-item {
  background: var(--white-trans-light);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  color: var(--white);
  font-weight: 500;
  cursor: default;
  transition: all 0.3s;
}

.skill-item:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.3);
  transform: translateY(-5px);
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}

.project-item {
  background: var(--white-trans);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px;
  padding: 28px;
  color: var(--white);
  cursor: default;
  transition: all 0.3s;
}

.project-item:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.35);
  transform: translateY(-6px);
}

.proj-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.proj-desc {
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 16px;
  opacity: 0.95;
}

.proj-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.proj-tag {
  font-size: 0.75rem;
  padding: 5px 12px;
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
  backdrop-filter: blur(20px);
}

.edu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.edu-item {
  background: var(--white-trans-light);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  padding: 24px;
  color: var(--white);
}

.edu-year {
  font-size: 0.8rem;
  opacity: 0.7;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.edu-degree {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 6px;
}

.edu-institute {
  font-size: 0.95rem;
  opacity: 0.9;
}

footer {
  padding: 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--white-trans-light);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.2);
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 50px;
}

.footer-logo {
  font-size: 1.3rem;
  color: var(--white);
  font-weight: 700;
}

.footer-socials {
  display: flex;
  gap: 12px;
}

.social-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--white-trans);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  text-decoration: none;
  transition: all 0.3s;
}

.social-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.3);
  transform: translateY(-3px);
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-logo">GLASS</div>
  <div class="nav-links">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#education">Education</a>
  </div>
</nav>

<section class="hero" id="hero">
  <div class="hero-content">
    <div class="hero-tag">✨ Welcome</div>
    <h1 class="hero-name">
      <span id="heroFirstName">Glass</span><br>
      <span id="heroLastName">Morph</span>
    </h1>
    <p class="hero-desc" id="heroBio">Loading…</p>
    <div class="hero-actions">
      <a class="btn btn-solid" id="heroGithub" href="#" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a class="btn btn-glass" id="heroLinkedin" href="#" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
    </div>
  </div>

  <div class="hero-card">
    <div class="card-title">Profile</div>
    <div class="card-item">
      <span class="card-label">Name</span>
      <span class="card-value" id="panelName">—</span>
    </div>
    <div class="card-item">
      <span class="card-label">Role</span>
      <span class="card-value" id="panelRole">—</span>
    </div>
    <div class="card-item">
      <span class="card-label">Location</span>
      <span class="card-value" id="panelLocation" contenteditable="true" data-collection="users" data-field="location">—</span>
    </div>
    <div class="card-item">
      <span class="card-label">Email</span>
      <span class="card-value"><a id="panelEmail" href="mailto:" style="color:var(--white); text-decoration:none;">—</a></span>
    </div>
  </div>
</section>

<section class="section" id="about">
  <div class="sec-label">About</div>
  <h2 class="sec-title">My Story</h2>
  <div class="about-text" id="aboutText">Loading…</div>
</section>

<section class="section" id="skills">
  <div class="sec-label">Skills</div>
  <h2 class="sec-title">What I Do</h2>
  <div class="skills-grid" id="skillsGrid"></div>
</section>

<section class="section" id="projects">
  <div class="sec-label">Portfolio</div>
  <h2 class="sec-title">Recent Work</h2>
  <div class="projects-grid" id="projectsGrid"></div>
</section>

<section class="section" id="education">
  <div class="sec-label">Education</div>
  <h2 class="sec-title">Background</h2>
  <div class="edu-grid" id="educationList"></div>
</section>

<footer>
  <div class="footer-logo">GLASS MORPH</div>
  <div class="footer-socials">
    <a class="social-btn" id="footerGithub" href="#" target="_blank"><i class="fab fa-github"></i></a>
    <a class="social-btn" id="footerLinkedin" href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
  </div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc,
  collection, getDocs, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4q_KzBCxVtS6mjH6Xh6-Bd1u-21RSNG4",
  authDomain: "portfoliox-2e787.firebaseapp.com",
  projectId: "portfoliox-2e787"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

function setText(id, val, fb="—") {
  const el = document.getElementById(id);
  if(el) el.textContent = val || fb;
}

onAuthStateChanged(auth, async (user) => {
  if(!user) return;
  currentUser = user;

  const snap = await getDoc(doc(db, "users", user.uid));
  const d = snap.exists() ? snap.data() : {};

  const fullName = d.fullName || "Developer";
  const parts = fullName.trim().split(" ");
  const first = parts[0] || "YOUR";
  const last = parts.slice(1).join(" ") || "NAME";

  setText("heroFirstName", first.toUpperCase());
  setText("heroLastName", last.toUpperCase());
  setText("heroBio", d.about || "");
  setText("panelName", d.fullName || "—");
  setText("panelRole", d.role || "Developer");
  setText("panelLocation", d.location || "—");
  setText("aboutText", d.about || "");

  if(d.github) ["heroGithub","footerGithub"].forEach(id => {const el = document.getElementById(id); if(el) el.href = d.github;});
  if(d.linkedin) ["heroLinkedin","footerLinkedin"].forEach(id => {const el = document.getElementById(id); if(el) el.href = d.linkedin;});
  if(d.email) document.getElementById("panelEmail").href = "mailto:" + d.email;

  const skillsSnap = await getDocs(collection(db,"users",user.uid,"skills"));
  const grid = document.getElementById("skillsGrid");
  grid.innerHTML = "";
  skillsSnap.forEach(ds => {
    const s = ds.data();
    grid.innerHTML += `<div class="skill-item" contenteditable="true" data-collection="skills" data-docid="${ds.id}" data-field="name">${s.name || "Skill"}</div>`;
  });

  const projSnap = await getDocs(collection(db,"users",user.uid,"projects"));
  const projGrid = document.getElementById("projectsGrid");
  projGrid.innerHTML = "";
  projSnap.forEach(ds => {
    const p = ds.data();
    const tags = (p.tech || "").split(",").map(t => t.trim()).filter(Boolean).map(t => `<span class="proj-tag">${t}</span>`).join("");
    projGrid.innerHTML += `<div class="project-item">
      <div class="proj-title" contenteditable="true" data-collection="projects" data-docid="${ds.id}" data-field="title">${p.title || ""}</div>
      <p class="proj-desc" contenteditable="true" data-collection="projects" data-docid="${ds.id}" data-field="description">${p.description || ""}</p>
      <div class="proj-tags">${tags}</div>
      ${p.link ? `<a href="${p.link}" target="_blank" style="color:var(--white);text-decoration:underline;">View Project →</a>` : ""}
    </div>`;
  });

  const eduSnap = await getDocs(collection(db,"users",user.uid,"education"));
  const eduList = document.getElementById("educationList");
  eduList.innerHTML = "";
  console.log("Education records found:", eduSnap.size);
  let eduCount = 0;
  eduSnap.forEach(ds => {
    const e = ds.data();
    eduCount++;
    console.log("Education entry:", e);
    eduList.innerHTML += `<div class="edu-card">
      <div class="edu-year">${e.year || ""}</div>
      <div class="edu-degree" contenteditable="true" data-collection="education" data-docid="${ds.id}" data-field="degree">${e.degree || ""}</div>
      <div style="font-size:0.85rem;" contenteditable="true" data-collection="education" data-docid="${ds.id}" data-field="institute">${e.institute || ""}</div>
    </div>`;
  });
  if(eduCount === 0) {
    console.warn("No education records found in Firestore");
    eduList.innerHTML = `<p style="color:#999;font-size:0.9rem;padding:20px;text-align:center;">No education records added yet. Add education details in dashboard to see them here.</p>`;
  }

  if(new URLSearchParams(window.location.search).get("mode") === "readonly") {
    document.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
  }
});

document.addEventListener("blur", async (e) => {
  const el = e.target;
  if(!el.hasAttribute("contenteditable") || !currentUser) return;
  const col = el.getAttribute("data-collection");
  const docId = el.getAttribute("data-docid") || currentUser.uid;
  const field = el.getAttribute("data-field");
  const val = el.innerText.trim();
  if(!col || !field) return;
  try {
    const ref = col === "users" ? doc(db, "users", docId) : doc(db, "users", currentUser.uid, col, docId);
    await updateDoc(ref, { [field]: val });
  } catch(err) { console.error(err); }
}, true);
</script>

</body>
</html>
