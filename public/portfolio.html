<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | PortfolioX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:linear-gradient(135deg,#020617,#0f172a);
      color:white;
      min-height:100vh;
      padding:40px 20px;
    }

    .container{
      max-width:1000px;
      margin:auto;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:40px;
      backdrop-filter:blur(16px);
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
    }

    .top{
      display:flex;
      gap:30px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:40px;
    }

    .top img{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #38bdf8;
      box-shadow:0 0 25px rgba(56,189,248,0.5);
    }

    .top h1{
      font-size:36px;
      margin-bottom:8px;
    }

    .top h2{
      color:#38bdf8;
      font-size:22px;
      margin-bottom:12px;
    }

    .info{
      color:#cbd5e1;
      line-height:1.8;
    }

    .section{
      margin-top:35px;
    }

    .section h3{
      font-size:24px;
      margin-bottom:18px;
      color:#38bdf8;
      border-bottom:1px solid rgba(255,255,255,0.08);
      padding-bottom:8px;
    }

    .card{
      background:rgba(255,255,255,0.04);
      padding:18px;
      border-radius:16px;
      margin-bottom:15px;
      border:1px solid rgba(255,255,255,0.05);
    }

    .skill{
      display:inline-block;
      background:rgba(56,189,248,0.15);
      border:1px solid rgba(56,189,248,0.25);
      color:#38bdf8;
      padding:10px 14px;
      border-radius:999px;
      margin:6px;
      font-size:14px;
    }

    .not-found{
      text-align:center;
      margin-top:100px;
      font-size:30px;
      color:#f87171;
    }
  </style>
</head>
<body>
  <div class="container" id="portfolioContainer" style="display:none;">
    <div class="top">
      <img id="photo" src="https://via.placeholder.com/140" alt="Profile Photo" />
      <div>
        <h1 id="name">Loading...</h1>
        <h2 id="title"></h2>

    <main id="mainArea" class="content">
      <aside class="profile-card" id="profileCard">
        <img id="photo" class="profile-photo" src="https://via.placeholder.com/320x320.png?text=No+Photo" alt="Profile photo" />
        <div id="name" class="profile-name">Name</div>
        <div id="role" class="profile-role">Role</div>
        <ul class="info-list">
          <li><strong>Email</strong><span id="email">-</span></li>
          <li><strong>Phone</strong><span id="phone">-</span></li>
          <li><strong>Location</strong><span id="location">-</span></li>
          <li><strong>Languages</strong><span id="languages">-</span></li>
        </ul>
      </aside>

      <section class="main-panel" id="contentPanel">
        <div class="card">
          <div class="section-title">About</div>
          <p id="about" class="bio">Loading…</p>
        </div>

        <div id="skillsCard" class="card">
          <div class="section-title">Skills</div>
          <div id="skills" class="tags"></div>
        </div>

        <div id="projectsCard" class="card">
          <div class="section-title">Projects</div>
          <div id="projects" class="project-grid"></div>
        </div>

        <div id="educationCard" class="card">
          <div class="section-title">Education</div>
          <div id="education" class="edu-list"></div>
        </div>

        <div id="experienceCard" class="card">
          <div class="section-title">Experience</div>
          <div id="experience" class="exp-list"></div>
        </div>
      </section>
    </main>

    <div id="message" class="alert" style="display:none"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4q_KzBCxVtS6mjH6Xh6-Bd1u-21RSNG4",
      authDomain: "portfoliox-2e787.firebaseapp.com",
      projectId: "portfoliox-2e787",
      storageBucket: "portfoliox-2e787.firebasestorage.app",
      messagingSenderId: "562709786891",
      appId: "1:562709786891:web:2d0f575ab7d3bda5fdf20e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const username = window.location.pathname.replace("/", "").trim();

    async function loadPortfolio() {
      try {
        if (!username) {
          document.getElementById("notFound").style.display = "block";
          return;
        }

        const usersRef = collection(db, "users");
        const q = query(usersRef, where("username", "==", username));
        const userSnap = await getDocs(q);

        if (userSnap.empty) {
          document.getElementById("notFound").style.display = "block";
          return;
        }

        const userDoc = userSnap.docs[0];
        const userId = userDoc.id;
        const userData = userDoc.data();

        document.getElementById("portfolioContainer").style.display = "block";

        document.getElementById("name").innerText = userData.name || "No Name";
        document.getElementById("title").innerText = userData.title || "";
        document.getElementById("about").innerText = userData.about || "";
        document.getElementById("email").innerText = userData.email || "";
        document.getElementById("phone").innerText = userData.phone || "";
        document.getElementById("location").innerText = userData.location || "";

        if (userData.photoURL) {
          document.getElementById("photo").src = userData.photoURL;
        }

        // Skills
        const skillsSnap = await getDocs(collection(db, "users", userId, "skills"));
        const skillsContainer = document.getElementById("skills");
        skillsSnap.forEach(doc => {
          const s = doc.data();
          const div = document.createElement("div");
          div.className = "skill";
          div.innerText = s.name || "Skill";
          skillsContainer.appendChild(div);
        });

        // Education
        const eduSnap = await getDocs(collection(db, "users", userId, "education"));
        const eduContainer = document.getElementById("education");
        eduSnap.forEach(doc => {
          const e = doc.data();
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <strong>${e.degree || e.name || "Education"}</strong><br>
            <span>${e.institute || e.institution || e.school || ""}</span><br>
            <small>${e.year || ""}</small>
          `;
          eduContainer.appendChild(div);
        });

        // Projects
        const projSnap = await getDocs(collection(db, "users", userId, "projects"));
        const projContainer = document.getElementById("projects");
        projSnap.forEach(doc => {
          const p = doc.data();
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <strong>${p.title || "Project"}</strong><br>
            <p>${p.description || ""}</p>
            ${p.link ? `<a href="${p.link}" target="_blank" style="color:#38bdf8;">View Project</a>` : ""}
          `;
          projContainer.appendChild(div);
        });

      } catch (error) {
        console.error("Portfolio load error:", error);
        document.getElementById("notFound").style.display = "block";
      }
    }

    loadPortfolio();
  </script>
</body>
</html>
