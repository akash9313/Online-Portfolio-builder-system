<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio | PortfolioX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0e1a; --accent: #38bdf8; --accent-2: #6366f1; --accent-3: #22c55e;
      --text: #f1f5f9; --muted: #94a3b8; --danger: #ef4444;
      --gradient: linear-gradient(135deg, #38bdf8, #6366f1);
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; }

    /* ── Loading ── */
    #loadingScreen {
      position:fixed; inset:0; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem;
      z-index:9999; transition:opacity 0.5s ease;
    }
    #loadingScreen.fade { opacity:0; pointer-events:none; }
    .load-logo { font-size:1.4rem; font-weight:800; }
    .load-logo .x { background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .load-bar { width:220px; height:3px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
    .load-fill { height:100%; background:var(--gradient); border-radius:2px; animation:loadIn 1.4s ease forwards; }
    .load-text { font-size:0.85rem; color:var(--muted); }
    @keyframes loadIn { from{width:0} to{width:100%} }

    /* ── Not found ── */
    #notFound {
      display:none; min-height:100vh;
      flex-direction:column; align-items:center; justify-content:center; gap:1.2rem;
      text-align:center; padding:2rem;
    }
    #notFound .nf-icon { font-size:3rem; color:var(--danger); margin-bottom:0.5rem; }
    #notFound h2 { font-size:1.6rem; font-weight:800; }
    #notFound p  { color:var(--muted); max-width:360px; line-height:1.6; }
    #notFound a  { display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border-radius:12px; background:var(--gradient); color:white; text-decoration:none; font-weight:600; margin-top:0.5rem; transition:all 0.3s; }
    #notFound a:hover { transform:translateY(-2px); }

    /* ── Private ── */
    #privateScreen {
      display:none; min-height:100vh;
      flex-direction:column; align-items:center; justify-content:center; gap:1.2rem;
      text-align:center; padding:2rem;
    }
    #privateScreen .priv-icon { width:72px; height:72px; border-radius:20px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.25); display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:#f59e0b; margin:0 auto; }
    #privateScreen h2 { font-size:1.5rem; font-weight:800; }
    #privateScreen p  { color:var(--muted); max-width:340px; line-height:1.6; }

    /* ── Template iframe ── */
    #portfolioFrame {
      display:none; width:100%; height:100vh; border:none;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loadingScreen">
  <div class="load-logo">Portfolio<span class="x">X</span></div>
  <div class="load-bar"><div class="load-fill"></div></div>
  <div class="load-text">Loading portfolio…</div>
</div>

<!-- Not found -->
<div id="notFound" style="display:flex;">
  <div class="nf-icon"><i class="fas fa-face-frown"></i></div>
  <h2>Portfolio Not Found</h2>
  <p>The portfolio you're looking for doesn't exist or hasn't been published yet.</p>
  <a href="loginpage.html"><i class="fas fa-rocket"></i> Create Your Portfolio</a>
</div>

<!-- Private -->
<div id="privateScreen">
  <div class="priv-icon"><i class="fas fa-lock"></i></div>
  <h2>This Portfolio is Private</h2>
  <p>The owner has set this portfolio to private. Only they can view it.</p>
</div>

<!--
  The actual portfolio renders inside an iframe pointing to the chosen template file.
  The template file reads the userId from the URL param and fetches data itself.
-->
<iframe id="portfolioFrame" title="Portfolio"></iframe>

<script type="module">
  import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4q_KzBCxVtS6mjH6Xh6-Bd1u-21RSNG4",
    authDomain: "portfoliox-2e787.firebaseapp.com",
    projectId: "portfoliox-2e787",
    storageBucket: "portfoliox-2e787.firebasestorage.app",
    messagingSenderId: "562709786891",
    appId: "1:562709786891:web:2d0f575ab7d3bda5fdf20e"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  /* ── Parse username from URL
     Supports:
       /u/username            → path-based (Firebase Hosting rewrites)
       /portfolio.html?u=username → query param fallback
  ── */
  function getUsername() {
    // Query param: ?u=username  (works without hosting rewrites)
    const params = new URLSearchParams(window.location.search);
    if (params.get('u')) return params.get('u').trim().toLowerCase();

    // Path: /u/username
    const parts = window.location.pathname.split('/').filter(Boolean);
    const uIdx  = parts.indexOf('u');
    if (uIdx !== -1 && parts[uIdx+1]) return parts[uIdx+1].trim().toLowerCase();

    // Fallback: last path segment
    const last = parts[parts.length - 1];
    if (last && last !== 'portfolio.html') return last.toLowerCase();

    return null;
  }

  const username = getUsername();

  const loadingEl  = document.getElementById('loadingScreen');
  const notFoundEl = document.getElementById('notFound');
  const privateEl  = document.getElementById('privateScreen');
  const frameEl    = document.getElementById('portfolioFrame');

  function hideLoader() {
    setTimeout(() => {
      loadingEl.classList.add('fade');
      setTimeout(() => loadingEl.style.display = 'none', 500);
    }, 900);
  }

  async function loadPortfolio() {
    if (!username) { notFoundEl.style.display = 'flex'; hideLoader(); return; }

    try {
      // Query Firestore for user with this username
      const q    = query(collection(db,'users'), where('username','==',username));
      const snap = await getDocs(q);

      if (snap.empty) { notFoundEl.style.display = 'flex'; hideLoader(); return; }

      const userDoc  = snap.docs[0];
      const userId   = userDoc.id;
      const userData = userDoc.data();

      // Check visibility
      if (userData.visibility === 'private') {
        privateEl.style.display = 'flex'; hideLoader(); return;
      }

      // Not published
      if (!userData.published) {
        notFoundEl.style.display = 'flex'; hideLoader(); return;
      }

      // ✅ Load the template file in the iframe, passing userId as a query param
      // The template file will use userId to fetch all user data from Firestore
      const templateFile = userData.templateFile || 'templates/classic.html';
      frameEl.src        = `${templateFile}?uid=${userId}&readonly=true`;
      frameEl.style.display = 'block';

      // Update page title with user's name
      if (userData.fullName) document.title = `${userData.fullName} | PortfolioX`;

      frameEl.onload = hideLoader;

    } catch (err) {
      console.error('Portfolio load error:', err);
      notFoundEl.style.display = 'flex';
      hideLoader();
    }
  }

  loadPortfolio();
</script>
</body>
</html>
