<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | PortfolioX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="shortcut icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="loginpage.css">
</head>
<body>

<!-- Background -->
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="particles" id="particles"></div>

<!-- Toast -->
<div class="toast success" id="toast">
  <i class="fas fa-check-circle" id="toastIcon"></i>
  <span id="toastMsg"></span>
</div>

<!-- Login Card -->
<div class="login-wrap">
  <div class="login-card">

    <!-- Header -->
    <div class="card-header">
      <a href="#" class="logo-mark">
        <div class="icon"><i class="fas fa-rocket"></i></div>
        Portfolio<span class="x">X</span>
      </a>
      <h1>Welcome back</h1>
      <p>Sign in to continue building your portfolio</p>
    </div>

    <!-- Alert banner -->
    <div class="alert-banner warn" id="alertBanner">
      <i class="fas fa-triangle-exclamation"></i>
      <span id="alertMsg">Your email is not verified. Please check your Inbox, Spam, or Promotions folder.</span>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope input-icon"></i>
          <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input class="field-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" id="pwToggle" title="Show/hide password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-row-meta">
        <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
      </div>

      <button class="btn-main btn-primary" type="submit" id="loginBtn">
        <div class="spinner"></div>
        <span class="btn-text"><i class="fas fa-arrow-right-to-bracket"></i>&nbsp; Sign In</span>
      </button>

    </form>

    <!-- Divider -->
    <div class="divider">OR CONTINUE WITH</div>

    <!-- Google -->
    <button class="btn-main btn-google" type="button" id="googleBtn">
      <div class="spinner"></div>
      <svg class="google-icon btn-text" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span class="btn-text">Continue with Google</span>
    </button>

    <!-- Footer -->
    <div class="card-footer">
      Don't have an account? <a href="usersignup.html">Create one free</a>
    </div>

    <!-- Features -->
    <div class="features-row">
      <div class="feature-item"><i class="fas fa-check"></i> Free forever</div>
      <div class="feature-item"><i class="fas fa-check"></i> No credit card</div>
      <div class="feature-item"><i class="fas fa-check"></i> Instant publish</div>
    </div>

  </div>
</div>

<script type="module" src="loginpage.js"></script>
</body>
</html>
