<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Classic Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #020617;
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      color: #1e40af;
      font-size: 34px;
    }

    .role {
      font-size: 18px;
      color: #475569;
    }

    .contact a {
      margin-left: 15px;
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
    }

    section {
      margin-top: 40px;
    }

    section h2 {
      border-bottom: 3px solid #2563eb;
      display: inline-block;
      margin-bottom: 15px;
      padding-bottom: 5px;
      color: #1e40af;
    }

    ul {
      padding-left: 20px;
    }

    .skill {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 8px 14px;
      margin: 6px;
      border-radius: 20px;
      font-weight: 600;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin-bottom: 18px;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1 id="fullName" contenteditable="true" data-collection="users" data-field="fullName">Loading...</h1>
      <p class="role" id="role" contenteditable="true" data-collection="users" data-field="role"></p>
      <p id="location" contenteditable="true" data-collection="users" data-field="location"></p>
    </div>

    <div class="contact">
      <a id="github" target="_blank" contenteditable="true" data-collection="users" data-field="github">GitHub</a>
      <a id="linkedin" target="_blank" contenteditable="true" data-collection="users" data-field="linkedin">LinkedIn</a>
    </div>
  </header>

  <section>
    <h2>About</h2>
    <p id="about" contenteditable="true" data-collection="users" data-field="about"></p>
  </section>

  <section>
    <h2>Skills</h2>
    <div id="skills"></div>
  </section>

  <section>
    <h2>Projects</h2>
    <div id="projects"></div>
  </section>

  <section>
    <h2>Education</h2>
    <div id="education"></div>
  </section>

  <footer>
    © 2026 PortfolioX
  </footer>

  <!-- ================= FIREBASE DATA FETCH ================= -->
  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from
      "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      updateDoc
    } from
      "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    /* Firebase config */
    const firebaseConfig = {
      apiKey: "AIzaSyD4q_KzBCxVtS6mjH6Xh6-Bd1u-21RSNG4",
      authDomain: "portfoliox-2e787.firebaseapp.com",
      projectId: "portfoliox-2e787"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* UI */
    const fullName = document.getElementById("fullName");
    const role = document.getElementById("role");
    const about = document.getElementById("about");
    const locationEl = document.getElementById("location");
    const github = document.getElementById("github");
    const linkedin = document.getElementById("linkedin");

    const skillsEl = document.getElementById("skills");
    const projectsEl = document.getElementById("projects");
    const educationEl = document.getElementById("education");

    let currentUser = null;

    /* AUTH */
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      currentUser = user;

      /* PROFILE */
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      const data = snap.data();

      fullName.textContent = data.fullName;
      role.textContent = data.role;
      about.textContent = data.about;
      locationEl.textContent = data.location;
      github.href = data.github;
      linkedin.href = data.linkedin;

      /* SKILLS */
      const skillsSnap = await getDocs(collection(db, "users", user.uid, "skills"));
      skillsSnap.forEach(docSnap => {
        const s = docSnap.data();
        skillsEl.innerHTML += `<span class="skill" contenteditable="true" data-collection="skills" data-docid="${docSnap.id}" data-field="name">${s.name}</span>`;
      });

      /* PROJECTS */
      const projectSnap = await getDocs(collection(db, "users", user.uid, "projects"));
      projectSnap.forEach(docSnap => {
        const p = docSnap.data();
        projectsEl.innerHTML += `
      <div class="card">
        <h3 contenteditable="true" data-collection="projects" data-docid="${docSnap.id}" data-field="title">${p.title}</h3>
        <p contenteditable="true" data-collection="projects" data-docid="${docSnap.id}" data-field="description">${p.description}</p>
        <p><strong>Tech:</strong> <span contenteditable="true" data-collection="projects" data-docid="${docSnap.id}" data-field="tech">${p.tech}</span></p>
        ${p.link ? `<a href="${p.link}" target="_blank" contenteditable="true" data-collection="projects" data-docid="${docSnap.id}" data-field="link">View Project</a>` : ""}
      </div>
    `;
      });

      /* EDUCATION */
      const eduSnap = await getDocs(collection(db, "users", user.uid, "education"));
      eduSnap.forEach(docSnap => {
        const e = docSnap.data();
        educationEl.innerHTML += `
      <div class="card">
        <h3 contenteditable="true" data-collection="education" data-docid="${docSnap.id}" data-field="degree">${e.degree}</h3>
        <p contenteditable="true" data-collection="education" data-docid="${docSnap.id}" data-field="institute">${e.institute}</p>
        <p contenteditable="true" data-collection="education" data-docid="${docSnap.id}" data-field="year">${e.year}</p>
        <p contenteditable="true" data-collection="education" data-docid="${docSnap.id}" data-field="grade">${e.grade || ""}</p>
      </div>
    `;
      });

      /* READ-ONLY MODE CHECK */
      const urlParams = new URLSearchParams(window.location.search);
      const isReadOnly = urlParams.get('mode') === 'readonly';
      if (isReadOnly) {
        // Remove all contenteditable attributes AFTER they render
        const editableElements = document.querySelectorAll('[contenteditable="true"]');
        editableElements.forEach(el => el.removeAttribute('contenteditable'));
      } else {
        // PREVENT LINK CLICKS IN EDIT MODE
        document.querySelectorAll('a[contenteditable="true"]').forEach(el => {
          el.addEventListener('click', (e) => e.preventDefault());
        });
      }

    });

    /* IN-PLACE EDITING (SAVE ON BLUR) */
    document.addEventListener("blur", async (e) => {
      if (e.target.hasAttribute("contenteditable") && currentUser) {
        const el = e.target;
        const collectionName = el.getAttribute("data-collection");
        const docId = el.getAttribute("data-docid") || currentUser.uid; // Profile fields use uid
        const field = el.getAttribute("data-field");
        const newValue = el.innerText.trim();

        if (collectionName && field) {
          try {
            let docRef;
            if (collectionName === "users") {
              docRef = doc(db, "users", docId);
            } else {
              docRef = doc(db, "users", currentUser.uid, collectionName, docId);
            }

            await updateDoc(docRef, {
              [field]: newValue
            });
            console.log(`Updated ${field} to ${newValue} in ${collectionName}`);
          } catch (err) {
            console.error("Error updating document:", err);
          }
        }
      }
    }, true);
  </script>

</body>

</html>
